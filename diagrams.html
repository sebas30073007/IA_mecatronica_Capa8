<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>CAPA 8</title>
  <link rel="icon" type="image/png" href="./assets/img/favicon.png?v=2">
  <!--
    Alias histórico. El simulador vive ahora en la raíz.

    Esta página existe solo para no romper las URLs `?g=<base64>` que ya
    circulen: las topologías se comparten por enlace, así que un enlace
    muerto es una topología perdida. Redirige preservando el query string
    entero y sin dejar entrada en el historial, para que el botón «atrás»
    no rebote entre las dos páginas.
  -->
  <script>
    location.replace("./index.html" + location.search + location.hash);
  </script>
  <!-- Sin <meta refresh> a propósito: no conserva el query string, y una
       redirección que pierde el ?g= pierde la topología del usuario. -->
</head>
<body>
  <p style="font-family: system-ui, sans-serif; padding: 2rem;">
    El simulador se movió a la raíz.
    <a href="./index.html">Continuar →</a>
  </p>
</body>
</html>
